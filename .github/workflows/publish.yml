name: publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, tag ou commit du fork à construire (ex. deploy)"
        required: true
        default: deploy
      version:
        description: "Tag de l'image à publier (ex. 1.0.2-fr.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.version }}
