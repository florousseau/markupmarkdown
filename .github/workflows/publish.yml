name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version amont, sans le v (ex. 1.0.2)"
        required: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # Le workflow vit sur la branche par défaut ; le code construit est celui du tag amont.
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.version }}
